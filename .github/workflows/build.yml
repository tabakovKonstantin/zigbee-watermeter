name: Build

on:
  push:
    branches: [main, ota]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check canonical Zigbee2MQTT converter syntax
        run: node --check external_converters/zigbeehive-watermeter.mjs

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    env:
      OTA_FILE_VERSION: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Run harness tests
        run: |
          python3 -m py_compile tools/watermeter_harness.py tests/python/test_watermeter_harness.py
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Run host tests
        shell: bash
        run: |
          cmake -S tests -B build-host-tests
          cmake --build build-host-tests
          ctest --test-dir build-host-tests --output-on-failure

      - name: Build firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . /opt/esp/idf/export.sh
          idf.py set-target esp32c6
          idf.py build

      - name: Check OTA slot size
        if: hashFiles('tools/mk_zigbee_ota.py') != ''
        run: python3 tools/watermeter_harness.py check-size

      - name: Create Zigbee OTA image
        if: hashFiles('tools/mk_zigbee_ota.py') != ''
        shell: bash
        run: |
          mkdir -p public/ota
          python3 tools/mk_zigbee_ota.py \
            --input build/watermeter.bin \
            --output public/ota/watermeter-${OTA_FILE_VERSION}.ota \
            --index public/ota/index.json \
            --url-base "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/ota" \
            --file-version "${OTA_FILE_VERSION}" \
            --comment "${GITHUB_SHA}"

      - uses: actions/upload-artifact@v7
        with:
          name: zigbee-watermeter-firmware
          path: |
            build/watermeter.bin
            build/partition_table/partition-table.bin
            public/ota/*.ota
            public/ota/index.json

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('public/ota/index.json') != ''
        with:
          path: public

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
